<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>My Movie Watchlist</h1>
    </div>
    <div class="container">
        <form id="movie-form" action="">
            <label for="movie-title">Movie Title</label><br>
            <input name="title" type="text" id="movie-title"><br>
            <label for="movie-genre">Movie Genre</label><br>
            <select name="genre" id="movie-genre">
                <option value="">Choose a Genre</option>
            </select><br>
            <button type="submit" id="submit">Add Movie</button>
        </form>
    </div>
    <div class="container">
        <p id="form-message"></p>
        <ul id="movie-list">

        </ul>
        <p id="empty-message"></p>
    </div>
</body>

</html>
